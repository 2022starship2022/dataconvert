[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dataconvert-cli"
version = "2.0.0"
description = "命令行数据转换和合并工具"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "DataConvert Team", email = "support@dataconvert.local"}
]
maintainers = [
    {name = "DataConvert Team", email = "support@dataconvert.local"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
keywords = ["data", "convert", "merge", "cli", "excel", "csv", "json"]
requires-python = ">=3.8"

# 核心依赖
dependencies = [
    # 核心数据处理库
    "pandas>=1.5.0",
    "numpy>=1.21.0",
    # Excel文件处理
    "openpyxl>=3.0.9",
    "xlsxwriter>=3.0.3",
    # 配置文件处理
    "PyYAML>=6.0",
    # Protobuf数据序列化
    "protobuf>=3.20.0",
    # 系统监控
    "psutil>=5.9.0",
    # 终端输出美化
    "colorama>=0.4.4",
    # XML处理增强
    "lxml>=4.6.0",
    # 数据库ORM (测试用)
    "sqlalchemy>=1.4.0",
    "bbpb>=1.4.2",
]

# 可选依赖组
[project.optional-dependencies]
# 开发依赖
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
]

# 构建依赖
build = [
    "nuitka>=2.0.0",
    "hatchling>=1.0.0",
]

# 完整安装（包含所有可选依赖）
all = [
    "dataconvert-cli[dev,build]"
]

# 命令行入口点
[project.scripts]
dataconvert = "cli.main:main"
dataconvert-cli = "cli.main:main"

# 项目URL
[project.urls]
Homepage = "https://github.com/dataconvert/dataconvert"
Documentation = "https://github.com/dataconvert/dataconvert/docs"
Repository = "https://github.com/dataconvert/dataconvert.git"
"Bug Tracker" = "https://github.com/dataconvert/dataconvert/issues"

# Hatchling配置
[tool.hatch.build.targets.wheel]
packages = ["cli", "core", "config", "merge", "utils"]

[tool.hatch.build.targets.sdist]
include = [
    "/cli",
    "/core", 
    "/config",
    "/merge",
    "/utils",
    "/README.md",
    "/pyproject.toml",
]
exclude = [
    "/test",
    "/docs",
    "/dist",
    "/dist_nuitka",
    "/.git",
    "/.coverage",
    "/htmlcov",
    "/logs",
    "*.pyc",
    "__pycache__",
]

# 工具配置
[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | dist_nuitka
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["cli", "core", "config", "merge", "utils"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["test"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["cli", "core", "config", "merge", "utils"]
omit = [
    "*/test/*",
    "*/tests/*",
    "*/__pycache__/*",
    "*/build/*",
    "*/dist/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "pandas.*",
    "numpy.*",
    "openpyxl.*",
    "xlsxwriter.*",
    "yaml.*",
    "protobuf.*",
    "psutil.*",
    "colorama.*",
    "lxml.*",
    "sqlalchemy.*",
]
ignore_missing_imports = true
